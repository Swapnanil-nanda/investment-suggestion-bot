<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PrimeTrade.ai - Asset Portal</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card glass-card">
      <div class="auth-header">
        <div class="auth-logo">PrimeTrade.ai</div>
        <div class="auth-subtitle">Backend Developer Assignment Portal</div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-4">
          Authenticate Session 🔑
        </button>
      </form>

      <div class="text-center mt-4">
        <span style="color: var(--text-secondary); font-size: 13px;">Don't have an account? </span>
        <a href="/register.html" style="font-size: 13px; font-weight: 500;">Register Account</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>

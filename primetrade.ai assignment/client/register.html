<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | PrimeTrade.ai - Asset Portal</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card glass-card">
      <div class="auth-header">
        <div class="auth-logo">PrimeTrade.ai</div>
        <div class="auth-subtitle">Create Developer Portal Account</div>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="•••••••• (Min. 6 characters)" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="role" class="form-label">Assign Portal Role</label>
          <select id="role" class="form-control">
            <option value="user">User (Standard Access)</option>
            <option value="admin">Admin (Full RBAC Permissions)</option>
          </select>
          <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
            * Role selector exposed to easily demonstrate role-based access control (RBAC).
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-4">
          Register Account 🚀
        </button>
      </form>

      <div class="text-center mt-4">
        <span style="color: var(--text-secondary); font-size: 13px;">Already have an account? </span>
        <a href="/index.html" style="font-size: 13px; font-weight: 500;">Login Here</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>

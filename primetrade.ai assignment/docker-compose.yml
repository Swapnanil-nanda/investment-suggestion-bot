version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: primetrade-auth-crud:latest
    container_name: primetrade_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=primetrade_super_secret_jwt_key_2026
      - MONGODB_URI= # Leaves it blank so it triggers the in-memory MongoDB fallback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
